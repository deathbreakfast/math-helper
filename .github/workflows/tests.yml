name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Create virtual environment
        working-directory: backend
        run: python -m venv .venv
      
      - name: Install dependencies
        working-directory: backend
        run: .venv/bin/pip install -r requirements.txt
      
      - name: Run pytest
        working-directory: backend
        run: .venv/bin/python -m pytest

  frontend-tests:
    name: Frontend Tests (E2E)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Create virtual environment
        working-directory: backend
        run: python -m venv .venv
      
      - name: Install backend dependencies
        working-directory: backend
        run: .venv/bin/pip install -r requirements.txt
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      
      - name: Start backend server
        working-directory: backend
        env:
          BACKEND_PORT: 5004
        run: |
          .venv/bin/python -m flask --app app run --port 5004 --host 0.0.0.0 &
          echo $! > /tmp/flask.pid
      
      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5004/healthz > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend to start... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1
      
      - name: Run Playwright tests
        working-directory: frontend
        env:
          BACKEND_PORT: 5004
          VITE_BACKEND_URL: http://localhost:5004
        run: npx playwright test --workers=1
      
      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/flask.pid ]; then
            kill $(cat /tmp/flask.pid) || true
          fi
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

